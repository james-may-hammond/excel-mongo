[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-mongo-backend"
version = "1.0.0"
description = "FastAPI backend for Excel-Mongo add-in"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.138.0",
    "uvicorn==0.49.0",
    "python-dotenv==1.2.2",
    "websockets",
    "motor==3.7.1",
    "pymongo==4.17.0",
    "dnspython==2.8.0",
    "pydantic==2.13.4",
    "httpx==0.28.1",
    "starlette==1.2.1",
    "cryptography>=41.0.0"
]

[tool.setuptools.packages.find]
include = ["be*"]
